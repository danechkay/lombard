<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${product.id != null ? 'Редактирование товара' : 'Новый товар'}">Товар</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="main container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <nav class="breadcrumb"><a th:href="@{/catalog}">Главная</a> / <a th:href="@{/admin}">Админ</a> / <a th:href="@{/admin/products}">Товары</a> / <span th:text="${product.id != null ? 'Редактирование' : 'Новый'}">Форма</span></nav>
        <h1 th:text="${product.id != null ? 'Редактирование товара' : 'Добавить товар'}">Товар</h1>
        <form th:if="${product.id == null}" th:action="@{/admin/products/new}" method="post" enctype="multipart/form-data" class="account-card">
            <div class="form-group"><label>Название *</label><input type="text" name="name" required/></div>
            <div class="form-group"><label>Описание</label><textarea name="description"></textarea></div>
            <div class="form-group"><label>Категория *</label>
                <select name="categoryId" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Категория</option>
                </select>
            </div>
            <div class="form-group"><label>Магазин *</label>
                <select name="storeId" required>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name}">Магазин</option>
                </select>
            </div>
            <div class="form-group"><label>Состояние *</label>
                <select name="condition"><option value="NEW">Новое</option><option value="USED">Б/У</option></select>
            </div>
            <div class="form-group"><label>Цена (₽) *</label><input type="number" name="price" step="0.01" min="0" required/></div>
            <div class="form-group"><label>Количество</label><input type="number" name="quantity" value="1" min="1"/></div>
            <div class="form-group"><label>Год</label><input type="number" name="year" placeholder="Необязательно"/></div>
            <div class="form-group"><label>Фото</label><input type="file" name="images" multiple accept="image/*"/></div>
            <div class="form-actions"><button type="submit" class="btn">Создать</button><a th:href="@{/admin/products}" class="btn btn-secondary">Отмена</a></div>
        </form>
        <form th:if="${product.id != null}" th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post" enctype="multipart/form-data" class="account-card">
            <div class="form-group"><label>Название *</label><input type="text" name="name" th:value="${product.name}" required/></div>
            <div class="form-group"><label>Описание</label><textarea name="description" th:text="${product.description}"></textarea></div>
            <div class="form-group"><label>Категория *</label>
                <select name="categoryId" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == product.category.id}">Категория</option>
                </select>
            </div>
            <div class="form-group"><label>Магазин *</label>
                <select name="storeId" required>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.name}"
                            th:selected="${product.store != null && s.id == product.store.id}">Магазин</option>
                </select>
            </div>
            <div class="form-group"><label>Состояние *</label>
                <select name="condition">
                    <option value="NEW" th:selected="${product.condition.name() == 'NEW'}">Новое</option>
                    <option value="USED" th:selected="${product.condition.name() == 'USED'}">Б/У</option>
                </select>
            </div>
            <div class="form-group"><label>Цена (₽) *</label><input type="number" name="price" step="0.01" min="0" th:value="${product.price}" required/></div>
            <div class="form-group"><label>Количество</label><input type="number" name="quantity" th:value="${product.quantity}" min="1"/></div>
            <div class="form-group"><label>Год</label><input type="number" name="year" th:value="${product.year}"/></div>
            <div class="form-group"><label>Статус</label>
                <select name="status">
                    <option value="DRAFT" th:selected="${product.status.name() == 'DRAFT'}">Черновик</option>
                    <option value="PUBLISHED" th:selected="${product.status.name() == 'PUBLISHED'}">Опубликован</option>
                    <option value="ARCHIVED" th:selected="${product.status.name() == 'ARCHIVED'}">В архиве</option>
                </select>
            </div>
            <div class="form-group"><label>Добавить фото</label><input type="file" name="images" multiple accept="image/*"/></div>
            <div class="form-actions"><button type="submit" class="btn">Сохранить</button><a th:href="@{/admin/products}" class="btn btn-secondary">Отмена</a></div>
        </form>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
