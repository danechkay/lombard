<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Товары — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="main container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <nav class="breadcrumb"><a th:href="@{/catalog}">Главная</a> / <a th:href="@{/admin}">Админ</a> / Товары</nav>
        <h1>Управление товарами</h1>
        <p>
            <a th:href="@{/admin/products/new}" class="btn">Добавить товар</a>
            <a th:href="@{/admin/categories}" class="btn btn-secondary">Категории</a>
            <a th:href="@{/admin/orders}" class="btn btn-secondary">Заказы</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="btn btn-secondary">Пользователи</a>
        </p>
        <table class="data-table">
            <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Магазин</th><th>Цена</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody>
                <tr th:each="p : ${products.content}">
                    <td th:text="${p.id}">0</td>
                    <td th:text="${p.name}">Название</td>
                    <td th:text="${p.category.name}">Категория</td>
                    <td th:text="${p.store != null ? p.store.name : '—'}">—</td>
                    <td th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT') + ' ₽'}">0</td>
                    <td th:text="${p.status}">статус</td>
                    <td>
                        <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-secondary" style="padding:0.3rem 0.6rem;">Изменить</a>
                        <form th:if="${p.status.name() == 'DRAFT'}" th:action="@{/admin/products/publish/{id}(id=${p.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn" style="padding:0.3rem 0.6rem;">Опубликовать</button>
                        </form>
                        <form th:if="${p.status.name() == 'PUBLISHED'}" th:action="@{/admin/products/unpublish/{id}(id=${p.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary" style="padding:0.3rem 0.6rem;">Снять</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="pagination" th:if="${products.totalPages > 1}">
            <a th:if="${products.hasPrevious()}" th:href="@{/admin/products(page=${products.number - 1})}">←</a>
            <span th:text="${'Страница ' + (products.number + 1) + ' из ' + products.totalPages}">1</span>
            <a th:if="${products.hasNext()}" th:href="@{/admin/products(page=${products.number + 1})}">→</a>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
