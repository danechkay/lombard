<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрация — Ламбарда</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="main container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <nav class="breadcrumb"><a th:href="@{/catalog}">Главная</a> / Регистрация</nav>
        <h1>Регистрация</h1>
        <div class="account-card" style="max-width: 400px;">
            <form th:action="@{/register}" th:object="${form}" method="post">
                <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>
                <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'error' : ''">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required/>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
                </div>
                <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? 'error' : ''">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" th:field="*{password}" required/>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></span>
                </div>
                <div class="form-group" th:classappend="${#fields.hasErrors('fullName')} ? 'error' : ''">
                    <label for="fullName">Полное имя</label>
                    <input type="text" id="fullName" th:field="*{fullName}" required/>
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error-text"></span>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="Необязательно"/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Зарегистрироваться</button>
                    <a th:href="@{/login}">Уже есть аккаунт</a>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
