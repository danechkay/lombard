<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Личный кабинет — Ламбарда</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="main container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <nav class="breadcrumb"><a th:href="@{/catalog}">Главная</a> / Личный кабинет</nav>
        <h1>Личный кабинет</h1>
        <div class="account-card">
            <p><strong>Имя:</strong> <span th:text="${user.fullName}">Имя</span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}">email</span></p>
            <p th:if="${user.phone != null}"><strong>Телефон:</strong> <span th:text="${user.phone}">телефон</span></p>
            <p><a th:href="@{/account/orders}" class="btn">История заказов</a></p>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
